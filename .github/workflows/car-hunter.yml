# ---------------------------------------------------------------------------
#  car-hunter — 리포트를 만들어 GitHub Pages 에 올린다 (배포 전용)
# ---------------------------------------------------------------------------
#  수집은 여기서 하지 않는다. 엔카가 데이터센터 IP 를 막기 때문이다.
#  GitHub 러너는 Azure 대역(예: 20.109.36.224)이라 엔카가 HTTP 407 을
#  돌려준다. 프록시 문제가 아니라 엔카 서버가 직접 거절하는 것이라
#  러너를 바꿔도 결과가 같다.
#
#  그래서 역할을 나눴다:
#    PC        run_weekly.bat  ->  수집 · 채점 · data 커밋 · push
#    이 워크플로  push 를 받아   ->  리포트를 다시 만들고 Pages 에 배포
#
#  채점(score.py)은 네트워크가 필요 없다. 저장소에 커밋된 listings.csv 만
#  있으면 되므로 클라우드에서도 문제없이 돈다. 그래서 report.html 자체는
#  커밋하지 않고 여기서 다시 만든다 — 배포본이 항상 커밋된 데이터와 일치한다.
#
#  수동 실행: 저장소 > Actions > car-hunter > Run workflow
# ---------------------------------------------------------------------------
name: car-hunter

on:
  push:
    branches: [main]
    paths:
      - "car-hunter/data/**"      # PC 가 새 수집 결과를 올렸을 때
      - "car-hunter/*.py"         # 채점·리포트 코드가 바뀌었을 때
      - ".github/workflows/car-hunter.yml"
  workflow_dispatch:              # 버튼으로 즉시 배포

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: car-hunter-pages
  cancel-in-progress: true        # 배포만 하므로 최신 것만 살리면 된다

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: car-hunter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 리포트 생성 (커밋된 데이터로 채점)
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python score.py --top 20

      - name: 배포할 파일 모으기
        run: |
          mkdir -p ../_site
          cp report.html ../_site/index.html
          printf 'User-agent: *\nDisallow: /\n' > ../_site/robots.txt
          ls -la ../_site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
